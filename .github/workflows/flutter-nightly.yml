name: Flutter Nightly Build

on:
  workflow_dispatch:

# Forks default GITHUB_TOKEN to read-only; the reusable build needs write
# (release upload) or the run fails at startup.
permissions:
  contents: write

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
